name: CI - RELEVO Monorepo

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Build, Typecheck & Tests (Shared, Backend, Frontend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Shared Workspace
        run: npm run build --workspace=shared

      - name: Typecheck
        run: npm run typecheck

      - name: Run Test Suite (Shared + Backend + Frontend)
        run: npm test
